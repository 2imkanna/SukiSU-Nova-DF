name: DirtyFrag VR Compatibility Build

on:
  workflow_dispatch:
  push:
    branches:
      - df-compat
    paths:
      - ".github/workflows/df-compat.yml"
      - "userspace/ksud/**"
      - "userspace/ksuinit/**"
      - "manager/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: df-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ksud:
    name: Build ksud (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    env:
      ANDROID_SDK_LEVEL: "26"
      CARGO_TERM_COLOR: always
      TRIPLE: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK package
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Build ksud
        shell: bash
        run: |
          set -euxo pipefail
          source .github/scripts/setup-rust-build.sh "$TRIPLE" "$ANDROID_SDK_LEVEL"
          cargo build --target "$TRIPLE" --release --manifest-path userspace/ksud/Cargo.toml

      - name: Upload ksud binary
        uses: actions/upload-artifact@v4
        with:
          name: ksud-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ksud
          if-no-files-found: error
          retention-days: 7

  build-manager:
    name: Build and verify Manager APK
    runs-on: ubuntu-latest
    needs: build-ksud
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Download ksud binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ksud-*
          path: artifacts
          merge-multiple: false

      - name: Package ksud as libksud.so
        shell: bash
        run: |
          set -euxo pipefail
          declare -A abi_dirs=(
            [aarch64-linux-android]=arm64-v8a
            [armv7-linux-androideabi]=armeabi-v7a
            [x86_64-linux-android]=x86_64
          )
          for target in "${!abi_dirs[@]}"; do
            src="artifacts/ksud-$target/ksud"
            test -s "$src"
            dest="manager/app/src/main/jniLibs/${abi_dirs[$target]}"
            mkdir -p "$dest"
            install -m 0755 "$src" "$dest/libksud.so"
            file "$dest/libksud.so"
          done

      - name: Build debug APK
        working-directory: manager
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify DirtyFrag VR library paths
        shell: bash
        run: |
          set -euxo pipefail
          apk=$(find manager/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          listing=$(unzip -Z1 "$apk")
          for abi in arm64-v8a armeabi-v7a x86_64; do
            printf '%s\n' "$listing" | grep -Fx "lib/$abi/libksud.so"
          done
          echo "Verified libksud.so for all three target ABIs in $apk"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Nova-DirtyFrag-DF-compat-debug
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
